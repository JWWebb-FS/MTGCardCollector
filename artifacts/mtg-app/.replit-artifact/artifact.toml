kind = "web"
previewPath = "/"
title = "MTG Collection Manager"
version = "1.0.0"
id = "artifacts/mtg-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24932

[services.development]
run = "pnpm --filter @workspace/mtg-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mtg-app", "run", "build" ]
publicDir = "artifacts/mtg-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24932"
BASE_PATH = "/"
